name: civicalert
description: CivicAlert - Community-Driven Road Issue Reporter & Disaster Alert System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # State Management
  provider: ^6.1.1

  # AI/ML
  google_generative_ai: ^0.4.0
  google_sign_in: ^6.2.1
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Camera/Images
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # HTTP
  dio: ^5.4.1
  http: ^1.2.0

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0

  # UI
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^8.0.2
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/